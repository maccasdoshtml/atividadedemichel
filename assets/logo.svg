<!--
  LOGO PROVISÓRIA — Escola Estadual Professor Abel Freire Coelho (Mossoró-RN)
  Desenho simples em azul, amarelo e branco.
  Para usar o brasão oficial, troque este arquivo por uma imagem (PNG ou SVG)
  mantendo o nome "logo.svg" (ou ajuste o caminho nos arquivos index.html).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-labelledby="titulo desc">
  <title id="titulo">Escola Estadual Professor Abel Freire Coelho</title>
  <desc id="desc">Escudo azul com borda amarela, livro aberto branco e o nome EEPAFC — Mossoró-RN.</desc>

  <defs>
    <linearGradient id="gradAzul" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E6FD0"/>
      <stop offset="1" stop-color="#0A3D8F"/>
    </linearGradient>
  </defs>

  <!-- borda amarela do escudo -->
  <path fill="#FFC107" d="M256 20 L462 96 V268 C462 372 376 452 256 492 C136 452 50 372 50 268 V96 Z"/>
  <!-- campo azul -->
  <path fill="url(#gradAzul)" d="M256 44.9 L440.4 112.8 V266.7
                              C440.4 356.8 364.5 430.3 256 466.2
                              C147.5 430.3 71.6 356.8 71.6 266.7 V112.8 Z"/>

  <!-- livro aberto -->
  <polygon fill="#FFFFFF" points="256,171 236,144 186,124 132,124 132,234 186,234 236,250 256,272"/>
  <polygon fill="#FFFFFF" points="256,171 276,144 326,124 380,124 380,234 326,234 276,250 256,272"/>
  <line x1="256" y1="171" x2="256" y2="272" stroke="#1565C0" stroke-width="6" stroke-linecap="round"/>

  <!-- faixa e textos -->
  <line x1="140" y1="300" x2="372" y2="300" stroke="#FFC107" stroke-width="7" stroke-linecap="round"/>
  <text x="256" y="370" text-anchor="middle" fill="#FFFFFF"
        font-family="'DejaVu Sans', Verdana, Arial, sans-serif" font-size="58" font-weight="700">EEPAFC</text>
  <text x="256" y="403" text-anchor="middle" fill="#FFC107"
        font-family="'DejaVu Sans', Verdana, Arial, sans-serif" font-size="23">MOSSORÓ · RN</text>
</svg>
